# Publishes the "wordman" package to GitHub Packages (the Packages tab of the repo).
#
# It runs when you publish a release. The release must already contain the installer
# (Wordman-Setup-vX.Y.Z.exe). The package then installs that exact file, checked with a SHA-256 hash.
# You can also start it by hand from the Actions tab (type the tag, for example v0.2.1).
name: Publish package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag that has the installer attached (for example v0.2.1)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: nuget/setup-nuget@v2

      - name: Work out the tag and the version
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          if (-not $tag) { $tag = "${{ inputs.tag }}" }
          if (-not $tag) { throw "No release tag given." }
          $version = $tag.TrimStart('v')
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Download the installer from the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:TAG --repo ${{ github.repository }} --pattern "Wordman-Setup-*.exe" --dir dl
          $file = Get-ChildItem dl -Filter "Wordman-Setup-*.exe" | Select-Object -First 1
          if (-not $file) { throw "Release $env:TAG has no Wordman-Setup-*.exe file attached." }
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash
          "INSTALLER_NAME=$($file.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CHECKSUM=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Fill in the package files
        shell: pwsh
        run: |
          $p = "package\tools\chocolateyinstall.ps1"
          $text = Get-Content $p -Raw
          $text = $text.Replace("__REPO__", "${{ github.repository }}").Replace("__TAG__", $env:TAG).Replace("__FILE__", $env:INSTALLER_NAME).Replace("__CHECKSUM__", $env:CHECKSUM)
          Set-Content -Path $p -Value $text -NoNewline

      - name: Build the package
        shell: pwsh
        run: nuget pack package\wordman.nuspec -Version $env:VERSION -OutputDirectory out

      - name: Push to GitHub Packages
        shell: pwsh
        run: dotnet nuget push "out\*.nupkg" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
